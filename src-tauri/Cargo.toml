[package]
name = "emoton"
version = "0.1.0"
description = "Emoton: the native shell around the local Emoton server"
edition = "2021"

[lib]
name = "emoton_lib"
path = "src/lib.rs"

[[bin]]
name = "emoton"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[profile.release]
strip = true
