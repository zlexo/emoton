<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Emoton app icon. macOS app shape: an 824 px rounded square centred on
       a 1024 canvas. A Manim-blue arrow drawing into a rounded box. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17171B"/>
      <stop offset="1" stop-color="#0E0E10"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="5.2" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto">
      <path d="M0.6 0.9 L9.2 5 L0.6 9.1 Z" fill="#58C4DD"/>
    </marker>
    <!-- Cuts a gap in the box's edge where the arrow passes through. -->
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <path d="M274 746 C 312 564, 420 436, 600 436" fill="none" stroke="#000" stroke-width="84"/>
    </mask>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#ground)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="3"/>
  <!-- the box -->
  <rect x="514" y="312" width="248" height="248" rx="36" fill="#58C4DD" fill-opacity="0.10"/>
  <rect x="498" y="296" width="280" height="280" rx="52" fill="none" stroke="#58C4DD" stroke-width="32" mask="url(#gap)"/>
  <!-- the arrow, mid-draw -->
  <path d="M274 746 C 312 564, 420 436, 600 436" fill="none" stroke="#58C4DD" stroke-width="32" stroke-linecap="round" marker-end="url(#head)"/>
  <!-- the dot where the stroke started, like Manim's Create -->
  <circle cx="274" cy="746" r="30" fill="#58C4DD"/>
</svg>
